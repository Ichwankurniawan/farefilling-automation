  match the "REFER TO..." pointer pattern nor the exact
  "NONE UNLESS OTHERWISE SPECIFIED" phrase, so a human loader would
  normally read this text directly to manually determine passenger-type,
  age, account code, ID, or direction restrictions. Extract only what the
  text explicitly states; leave any field the text doesn't address as null.
